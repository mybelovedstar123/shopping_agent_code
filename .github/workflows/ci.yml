name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the project
        run: pip install --disable-pip-version-check --quiet -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

{% extends "base.html" %}
{% block title %}Create an account - Kyo Shop{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Create an account</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form class="stacked" action="/register" method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Name <input type="text" name="name" value="{{ name }}" autocomplete="name" required></label>
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <button type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="/login?next={{ next|urlencode }}">Log in</a>.</p>
</div>
{% endblock %}

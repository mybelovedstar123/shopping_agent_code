{% extends "base.html" %}
{% block title %}Log in - Kyo Shop{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Log in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form class="stacked" action="/login" method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="/register?next={{ next|urlencode }}">Create an account</a>.</p>
</div>
{% endblock %}

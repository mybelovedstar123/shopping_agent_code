[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyo-shop"
version = "1.0.0"
description = "A team of independent shopping agents and the store they shop in"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "fastapi>=0.121", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["kyo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["agent.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format handles code; long regexes stay on one line

[tool.setuptools.package-data]
"kyo.web" = ["templates/*.html", "static/*"]
